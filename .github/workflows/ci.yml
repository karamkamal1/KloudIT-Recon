name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install FFmpeg (software encoders for the test host)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Vet (Linux + Windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Unit + integration tests
        run: go test -timeout 10m ./...
      - name: Latency rig tests (Python)
        run: python3 -m unittest discover -s tools/latency-rig/test
      - name: Build
        run: make build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser end-to-end test (headless Chromium)
        working-directory: test/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node browser.mjs
      - name: Latency rig flash page (headless Chromium)
        run: node tools/latency-rig/test/flash_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test/e2e/results/
          if-no-files-found: ignore

  # Native encoder helper (native/recon-encoder) built with MSVC, and its Go client
  # tested natively against it. No GPU on the runner: mock backend only.
  helper-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build recon-encoder.exe (MSVC)
        run: |
          cmake -S native/recon-encoder -B build/recon-encoder -A x64
          cmake --build build/recon-encoder --config Release --parallel
      - name: Helper integration tests (mock backend)
        run: |
          $env:RECON_HELPER_EXE = (Resolve-Path build/recon-encoder/bin/recon-encoder.exe).Path
          & $env:RECON_HELPER_EXE --print-caps
          go test -count=1 -v ./internal/host/encoder

  release-binaries:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mingw-w64 (recon-encoder.exe cross build)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 cmake
      - name: Build release bundles
        run: make release HELPER_REQUIRED=1
      - uses: actions/upload-artifact@v4
        with:
          name: kloudit-recon-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
