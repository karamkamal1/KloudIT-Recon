name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install FFmpeg (software encoders for the test host)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Vet (Linux + Windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Unit + integration tests
        run: go test -timeout 10m ./...
      - name: Build
        run: make build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser end-to-end test (headless Chromium)
        working-directory: test/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test/e2e/results/
          if-no-files-found: ignore

  # Native encoder helper (native/recon-encoder) built with MSVC, and its Go client
  # tested natively against it. No GPU on the runner: mock backend, WARP for the
  # GPU colour conversion. This build is the one the release bundle ships.
  helper-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build recon-encoder.exe (MSVC)
        run: |
          cmake -S native/recon-encoder -B build/recon-encoder -A x64
          cmake --build build/recon-encoder --config Release --parallel
      - name: Self-tests (frame pacing; encoder logic; BGRA to NV12 conversion on WARP)
        run: |
          $exe = (Resolve-Path build/recon-encoder/bin/recon-encoder.exe).Path
          & $exe --self-test-pacer
          if ($LASTEXITCODE -ne 0) { throw "--self-test-pacer failed ($LASTEXITCODE)" }
          & $exe --self-test-encoder
          if ($LASTEXITCODE -ne 0) { throw "--self-test-encoder failed ($LASTEXITCODE)" }
          $out = & $exe --self-test-convert
          $out
          if ($LASTEXITCODE -ne 0) { throw "--self-test-convert failed ($LASTEXITCODE)" }
          if (-not ($out -match 'self-test-convert: ok \(mode nv12\)')) { throw "conversion not tested on NV12 render targets" }
          $caps = & $exe --print-caps --backend=mock
          $caps
          if ($caps -match 'no C\+\+/WinRT headers') { throw "MSVC build without C++/WinRT: Windows.Graphics.Capture missing" }
      - name: Helper integration tests (mock backend)
        run: |
          $env:RECON_HELPER_EXE = (Resolve-Path build/recon-encoder/bin/recon-encoder.exe).Path
          go test -count=1 -v ./internal/host/encoder
      - uses: actions/upload-artifact@v4
        with:
          name: recon-encoder-msvc
          path: build/recon-encoder/bin/recon-encoder.exe
          if-no-files-found: error

  release-binaries:
    runs-on: ubuntu-24.04
    needs: [test, helper-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mingw-w64 (recon-encoder.exe cross build check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 cmake
      - name: mingw-w64 build of the helper (local / test builds; not shipped)
        run: make helper HELPER_REQUIRED=1
      - uses: actions/download-artifact@v4
        with:
          name: recon-encoder-msvc
          path: helper-msvc
      - name: Build release bundles (with the MSVC-built helper)
        run: make release HELPER_EXE=helper-msvc/recon-encoder.exe
      - uses: actions/upload-artifact@v4
        with:
          name: kloudit-recon-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
